<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAWWW Generator (Anthropic)</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h2 { text-align: center; }
    label { font-weight: bold; margin-top: 12px; display: block; }
    textarea, input {
        width: 100%; padding: 10px; margin-top: 5px;
        border-radius: 5px; border: 1px solid #ccc;
    }
    button {
        width: 100%; padding: 15px; margin-top: 20px;
        background: #003366; color: white;
        border: none; border-radius: 5px; font-size: 16px;
    }
    #output {
        white-space: pre-wrap; background: white;
        padding: 15px; margin-top: 20px;
        border-radius: 5px; border: 1px solid #ccc;
    }
</style>
</head>
<body>

<h2>AAWWW Generator (Anthropic)</h2>

<label>Anthropic API Key (stored locally)</label>
<input type="password" id="apikey" placeholder="Enter your API key">

<button onclick="saveKey()">Save Key</button>
<button onclick="clearKey()">Clear Saved Key</button>

<label>Time & Date of Incident</label>
<input type="datetime-local" id="when">

<label>Location</label>
<textarea id="where"></textarea>

<label>Who Was Involved</label>
<textarea id="who"></textarea>

<label>What Happened (Situation)</label>
<textarea id="what_situation"></textarea>

<label>Actions Taken</label>
<textarea id="what_actions"></textarea>

<label>Next Actions / Intent</label>
<textarea id="what_next"></textarea>

<button onclick="generate()">Generate AAWWW</button>
<button onclick="aiAssist()">AI Assist (Anthropic)</button>

<div id="output"></div>

<script>
// Load saved key
document.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem("anthropic_api_key");
    if (savedKey) document.getElementById("apikey").value = savedKey;
});

function saveKey() {
    const key = document.getElementById("apikey").value;
    if (!key) return alert("Enter a key first.");
    localStorage.setItem("anthropic_api_key", key);
    alert("API key saved.");
}

function clearKey() {
    localStorage.removeItem("anthropic_api_key");
    document.getElementById("apikey").value = "";
    alert("API key cleared.");
}

function generate() {
    const formatted = 
`AAWWW REPORT (ADF Military Police)

WHEN:
${document.getElementById("when").value}

WHERE:
${document.getElementById("where").value}

WHO:
${document.getElementById("who").value}

WHAT (Situation):
${document.getElementById("what_situation").value}

WHAT (Actions Taken):
${document.getElementById("what_actions").value}

WHAT (Next Actions / Intent):
${document.getElementById("what_next").value}
`;
    document.getElementById("output").innerText = formatted;
}

async function aiAssist() {
    const key = document.getElementById("apikey").value;
    if (!key) return alert("Enter your API key first.");

    const prompt = `
Rewrite the following AAWWW details into a clear, professional, ADF Military Police–style report.

WHEN: ${document.getElementById("when").value}
WHERE: ${document.getElementById("where").value}
WHO: ${document.getElementById("who").value}
WHAT (Situation): ${document.getElementById("what_situation").value}
WHAT (Actions Taken): ${document.getElementById("what_actions").value}
WHAT (Next Actions / Intent): ${document.getElementById("what_next").value}
`;

    try {
        const response = await fetch("https://nameless-unit-a6c3.alan-jack.workers.dev", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20241022",
                max_tokens: 500,
                messages: [
                    { "role": "user", "content": prompt }
                ]
            })
        });

        const data = await response.json();

        if (data.error) {
            document.getElementById("output").innerText =
                "ERROR:\n" + JSON.stringify(data.error, null, 2);
            return;
        }

        document.getElementById("output").innerText = data.content[0].text;

    } catch (err) {
        document.getElementById("output").innerText =
            "REQUEST FAILED:\n" + err.message;
    }
}
</script>

</body>
</html>
