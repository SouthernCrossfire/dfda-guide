<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAWWW Generator (Anthropic)</title>
<style>

    label { font-weight: bold; margin-top: 12px; display: block; }
    textarea, input {
        width: 100%; padding: 10px; margin-top: 5px;
        border-radius: 5px; border: 1px solid #ccc;
    }
    button {
        width: 100%; padding: 15px; margin-top: 20px;
        background: #003366; color: white;
        border: none; border-radius: 5px; font-size: 16px;
    }
    #output {
        white-space: pre-wrap; background: white;
        padding: 15px; margin-top: 20px;
        border-radius: 5px; border: 1px solid #ccc;
    }
</style>
</head>
<body>

<h2>AAWWW Generator (Anthropic)</h2>

<label>Anthropic API Key (stored locally)</label>
<input type="password" id="apikey" placeholder="Enter your API key">

<button onclick="saveKey()">Save Key</button>
<button onclick="clearKey()">Clear Saved Key</button>

<label>Time & Date of Incident</label>
<input type="datetime-local" id="when">

<label>Location</label>
<textarea id="where"></textarea>

<label>Who Was Involved</label>
<textarea id="who"></textarea>

<label>What Happened (Situation)</label>
<textarea id="what_situation"></textarea>

<label>Actions Taken</label>
<textarea id="what_actions"></textarea>

<label>Next Actions / Intent</label>
<textarea id="what_next"></textarea>

<button onclick="generate()">Generate AAWWW</button>
<button onclick="aiAssist()">AI Assist (Anthropic)</button>

<div id="output"></div>
