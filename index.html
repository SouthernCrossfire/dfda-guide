<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAWWW Generator (ADF MP + Anthropic)</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h2 { text-align: center; }
    label { font-weight: bold; margin-top: 12px; display: block; }
    textarea, input {
        width: 100%; padding: 10px; margin-top: 5px;
        border-radius: 5px; border: 1px solid #ccc;
    }
    button {
        width: 100%; padding: 15px; margin-top: 20px;
        background: #003366; color: white;
        border: none; border-radius: 5px; font-size: 16px;
    }
    #output {
        white-space: pre-wrap; background: white;
        padding: 15px; margin-top: 20px;
        border-radius: 5px; border: 1px solid #ccc;
    }
</style>
</head>
<body>

<h2>AAWWW Generator (ADF MP + Anthropic)</h2>

<label>Anthropic API Key (stored locally)</label>
<input type="password" id="apikey" placeholder="Enter your API key">

<button onclick="saveKey()">Save Key</button>
<button onclick="clearKey()">Clear Saved Key</button>

<label>Time & Date of Incident</label>
<input type="datetime-local" id="when">

<label>Location</label>
<textarea id="where" placeholder="Exact location, include whether on Commonwealth land"></textarea>

<label>Who Was Involved</label>
<textarea id="who" placeholder="Full identities, ranks, units, jurisdictions"></textarea>

<label>What Happened (Situation)</label>
<textarea id="what_situation" placeholder="Describe the incident clearly"></textarea>

<label>Actions Taken</label>
<textarea id="what_actions" placeholder="What you did, who you called, advice received"></textarea>

<label>Next Actions / Intent</label>
<textarea id="what_next" placeholder="Next steps, authorisations required, C2 awareness"></textarea>

<button onclick="generate()">Generate AAWWW</button>
<button onclick="aiAssist()">AI Assist (Anthropic)</button>

<div id="output"></div>

<script>
// Load saved key on startup
document.addEventListener("DOMContentLoaded", () => {
    const savedKey = localStorage.getItem("anthropic_api_key");
    if (savedKey) {
        document.getElementById("apikey").value = savedKey;
    }
});

function saveKey() {
    const key = document.getElementById("apikey").value;
    if (!key) {
        alert("Enter a key first.");
        return;
    }
    localStorage.setItem("anthropic_api_key", key);
    alert("API key saved locally.");
}

function clearKey() {
    localStorage.removeItem("anthropic_api_key");
    document.getElementById("apikey").value = "";
    alert("API key cleared.");
}

function generate() {
    const when = document.getElementById("when").value;
    const where = document.getElementById("where").value;
    const who = document.getElementById("who").value;
    const what_situation = document.getElementById("what_situation").value;
    const what_actions = document.getElementById("what_actions").value;
    const what_next = document.getElementById("what_next").value;

    const formatted = 
`AAWWW REPORT (ADF Military Police)

WHEN:
${when}

WHERE:
${where}

WHO:
${who}

WHAT (Situation):
${what_situation}

WHAT (Actions Taken):
${what_actions}

WHAT (Next Actions / Intent):
${what_next}
`;

    document.getElementById("output").innerText = formatted;
}

async function aiAssist() {
    const key = document.getElementById("apikey").value;
    if (!key) {
        alert("Enter your API key first.");
        return;
    }

    const prompt = `
Rewrite the following AAWWW details into a clear, professional, ADF Military Police–style report.

WHEN: ${document.getElementById("when").value}
WHERE: ${document.getElementById("where").value}
WHO: ${document.getElementById("who").value}
WHAT (Situation): ${document.getElementById("what_situation").value}
WHAT (Actions Taken): ${document.getElementById("what_actions").value}
WHAT (Next Actions / Intent): ${document.getElementById("what_next").value}
`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "x-api-key": key,
            "anthropic-version": "2023-06-01"
        },
        body: JSON.stringify({
            model: "claude-3-haiku-20240307",
            max_tokens: 500,
            messages: [{ role: "user", content: prompt }]
        })
    });

    const data = await response.json();
    document.getElementById("output").innerText = data.content[0].text;
}
</script>

</body>
</html>
